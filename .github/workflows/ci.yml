name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      # Backend API port
      PORT: 5000
      # Must match playwright.config.ts webServer.url
      BASE_URL: http://127.0.0.1:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Root install (adjust if your frontend/backend are separate workspaces)
      - name: Install root deps
        run: npm ci
        shell: bash

      - name: Diagnostic versions and folders
        run: |
          set -euxo pipefail
          node -v
          npm -v
          npx playwright --version || true
          ls -la
          npm ls @playwright/test || true
        shell: bash

      - name: Install Playwright browsers (with OS deps)
        run: npx playwright install --with-deps
        shell: bash

      # ------------------------
      # Backend API (port 5000) - keep if tests need API
      # ------------------------
      - name: Install backend API deps
        working-directory: runner/api
        run: npm ci
        shell: bash

      - name: Start backend API and wait
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          (cd runner/api && npm run dev > ../api-server.log 2>&1 & echo $! > ../api.pid)
          # Prefer health endpoint; otherwise fall back to port root
          npx --yes wait-on --timeout 300000 "http-get://127.0.0.1:${PORT}/health" || \
          npx --yes wait-on --timeout 300000 "http-get://127.0.0.1:${PORT}"
          curl -i "http://127.0.0.1:${PORT}/health" || true
        shell: bash

      # ------------------------
      # Frontend UI
      # ------------------------
      # IMPORTANT: Do NOT start frontend here.
      # Playwright will start build+preview via webServer from playwright.config.ts.

      - name: Probe API & environment
        run: |
          echo "Netstat for ports:"
          ss -lntp | (grep -E ':5000|:5173' || true)
          echo "Probe API /health:"
          curl -i "http://127.0.0.1:${PORT}/health" || true
        shell: bash

      # ------------------------
      # Playwright test run
      # ------------------------
      - name: List discovered tests
        run: npx playwright test --config=playwright/playwright.config.ts --list
        shell: bash

      - name: Run Playwright tests (Chromium)
        env:
          BASE_URL: http://127.0.0.1:5173
          # Ensure Playwright DOES start its webServer from config
          PLAYWRIGHT_START_WEB_SERVER: '1'
        run: |
          set -euxo pipefail
          npx playwright test \
            --config=playwright/playwright.config.ts \
            --project=Chromium \
            --reporter=html,line
        shell: bash

      # ------------------------
      # Artifacts
      # ------------------------
      - name: Locate HTML report directory
        if: always()
        run: |
          set -euxo pipefail
          REPORT_DIR="playwright-report"
          if [ ! -d "$REPORT_DIR" ] && [ -d "playwright/playwright-report" ]; then
            REPORT_DIR="playwright/playwright-report"
          fi
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          echo "Resolved REPORT_DIR=$REPORT_DIR"
          ls -la "$REPORT_DIR" || true
        shell: bash

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results (screenshots, traces, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright/.playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            api-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          set -euxo pipefail
          if [ -f "api.pid" ]; then kill -9 "$(cat api.pid)" || true; fi
          pkill -f "runner/api" || true
        shell: bash
