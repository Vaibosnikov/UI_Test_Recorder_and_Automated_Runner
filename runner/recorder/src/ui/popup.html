<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TestCraft Recorder</title>

  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #020617;
      --muted: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      width: 270px;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .toggle {
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1.2s infinite;
      display: none;
    }

    .dot.active {
      display: inline-block;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .counter {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      all: unset;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: background 0.2s ease;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
    }

    .export {
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }

    .error {
      color: var(--danger);
      display: none;
    }

    .error.show {
      display: block;
    }

    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    svg {
      width: 14px;
      height: 14px;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">🧪 TestCraft</div>
    <div id="themeToggle" class="toggle">Toggle theme</div>
  </div>

  <div class="indicator">
    <span id="recordDot" class="dot"></span>
    <span id="recordText">Idle</span>
  </div>

  <div id="counter" class="counter">Steps: 0</div>

  <div class="actions">
    <button id="start" class="primary">
      ▶ Start Recording
    </button>

    <button id="stop" class="secondary">
      ■ Stop Recording
    </button>

    <button id="export" class="export">
      ⬇ Export Test JSON
    </button>
  </div>

  <div id="error" class="error">
    ⚠ Unsupported page for recording
  </div>

  <div id="status" class="status"></div>

  <div class="footer">
    Recorder • Script Gen • Playwright
  </div>

  <script src="popup.js"></script>
</body>
</html>
