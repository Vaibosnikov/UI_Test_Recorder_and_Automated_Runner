name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request: {}

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://127.0.0.1:5000
      CI: true
      PORT: 5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Diagnostic versions and folders
        run: |
          node -v
          npm -v
          npx -p @playwright/test@latest playwright --version || true
          command -v playwright || true
          ls -la
          ls -la playwright || true

      - name: Install Playwright browsers
        run: npx -p @playwright/test@latest playwright install --with-deps

      - name: Install backend API deps
        working-directory: runner/api
        run: npm ci

      - name: Start backend API and wait
        timeout-minutes: 3
        run: |
          (cd runner/api && npm run dev > ../api-server.log 2>&1) &
          npx --yes wait-on "http-get://127.0.0.1:${PORT}/health"
          curl -sf "http://127.0.0.1:${PORT}/health" || (echo '---- backend log ----'; tail -n 200 api-server.log; exit 1)

      - name: List discovered tests
        run: npx -p @playwright/test@latest playwright test --config=playwright/playwright.config.ts --list

      - name: Run Playwright tests (Chromium)
        run: |
          npx -p @playwright/test@latest playwright test \
            --config=playwright/playwright.config.ts \
            --project=chromium \
            --reporter=html,line

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: api-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        run: pkill -f "runner/api" || true
