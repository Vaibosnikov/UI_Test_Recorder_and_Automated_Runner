name: TestCraft – Playwright CI Template

# TestCraft CI Template
# This workflow demonstrates how TestCraft-generated Playwright tests
# can be executed in a GitHub Actions CI environment.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      PORT: 5000
      BASE_URL: http://127.0.0.1:4173
      API_BASE_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ------------------------
      # Root dependencies
      # ------------------------
      - name: Install root dependencies
        run: npm ci
        shell: bash

      - name: Diagnostic versions
        run: |
          set -euxo pipefail
          node -v
          npm -v
          npx playwright --version || true
        shell: bash

      # ------------------------
      # Playwright browsers
      # ------------------------
      - name: Install Playwright browsers (with OS deps)
        run: npx playwright install --with-deps
        shell: bash

      # ------------------------
      # Frontend dependencies (required for build + preview)
      # ------------------------
      - name: Install frontend dependencies
        working-directory: runner/web
        run: npm ci
        shell: bash

      # ------------------------
      # Backend API
      # ------------------------
      - name: Install backend API dependencies
        working-directory: runner/api
        run: npm ci
        shell: bash

      - name: Start backend API and wait
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          (cd runner/api && npm run dev > ../api-server.log 2>&1 & echo $! > ../api.pid)
          npx --yes wait-on --timeout 300000 "http-get://127.0.0.1:${PORT}/health" || \
          npx --yes wait-on --timeout 300000 "http-get://127.0.0.1:${PORT}"
          curl -i "http://127.0.0.1:${PORT}/health" || true
        shell: bash

      # ------------------------
      # Playwright tests
      # Frontend is started automatically via playwright.config.ts webServer
      # ------------------------
      - name: List discovered tests
        run: npx playwright test --config=playwright/playwright.config.ts --list
        shell: bash

      - name: Run Playwright tests (Chromium)
        run: |
          set -euxo pipefail
          npx playwright test \
            --config=playwright/playwright.config.ts \
            --project=Chromium \
            --reporter=html,line
        shell: bash

      # ------------------------
      # Artifacts
      # ------------------------
      - name: Locate HTML report directory
        if: always()
        run: |
          set -euxo pipefail
          REPORT_DIR="playwright-report"
          if [ ! -d "$REPORT_DIR" ] && [ -d "playwright/playwright-report" ]; then
            REPORT_DIR="playwright/playwright-report"
          fi
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          ls -la "$REPORT_DIR" || true
        shell: bash

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright/.playwright-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            api-server.log
          if-no-files-found: ignore
          retention-days: 7

      # ------------------------
      # Cleanup
      # ------------------------
      - name: Stop backend server
        if: always()
        run: |
          set -euxo pipefail
          if [ -f "api.pid" ]; then kill -9 "$(cat api.pid)" || true; fi
        shell: bash
