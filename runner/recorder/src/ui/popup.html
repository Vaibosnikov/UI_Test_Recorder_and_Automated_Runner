<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TestCraft Recorder</title>

  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;

      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #020617;
      --muted: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      width: 270px;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .theme-btn {
      all: unset;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
    }

    .theme-btn:hover {
      background: rgba(255,255,255,0.14);
    }

    svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.2s infinite;
      display: none;
    }

    .dot.active {
      display: inline-block;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .counter {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      all: unset;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn-start {
      border: 1px solid var(--green);
      color: var(--green);
    }

    .btn-stop {
      border: 1px solid var(--red);
      color: var(--red);
    }

    .btn-export {
      border: 1px solid var(--blue);
      color: var(--blue);
    }

    .btn-convert {
      border: 1px solid var(--purple);
      color: var(--purple);
    }

    .btn-run {
      border: 1px solid var(--cyan);
      color: var(--cyan);
    }

    .btn-dashboard {
      border: 1px dashed var(--muted);
      color: var(--muted);
    }

    .btn:hover {
      background: rgba(255,255,255,0.08);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }

    .error {
      color: var(--red);
      display: none;
      font-size: 12px;
      margin-top: 6px;
    }

    .error.show {
      display: block;
    }

    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">🧪 TestCraft</div>
    <button id="themeToggle" class="theme-btn"></button>
  </div>

  <div class="indicator">
    <span id="recordDot" class="dot"></span>
    <span id="recordText">Idle</span>
  </div>

  <div id="counter" class="counter">Steps: 0</div>

  <div class="actions">
    <button id="start" class="btn btn-start">
      ▶ Start Recording
    </button>

    <button id="stop" class="btn btn-stop">
      ■ Stop Recording
    </button>

    <button id="export" class="btn btn-export">
      ⬇ Export JSON
    </button>

    <button id="convert" class="btn btn-convert">
      🔁 Convert to Test
    </button>

    <button id="run" class="btn btn-run">
      ▶ Run Test
    </button>

    <button id="dashboard" class="btn btn-dashboard">
      📊 Open Dashboard
    </button>
  </div>

  <div id="error" class="error">⚠ Unsupported page for recording</div>
  <div id="status" class="status"></div>

  <div class="footer">Recorder • Script Gen • Runner</div>

  <script src="popup.js"></script>
</body>
</html>
