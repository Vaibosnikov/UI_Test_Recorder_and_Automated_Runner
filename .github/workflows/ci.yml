name: CI - Playwright Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: runner/api
        run: npm ci

      - name: Install Web dependency
        working-directory: runner/web
        run: npm ci

      - name: Install Playwright dependency
        working-directory: runner/playwright
        run: npm install

      - name: Start API server
        working-directory: runner/api
        run: npm run dev &
        env:
          PORT: 5000

      - name: Start Web server
        working-directory: runner/web
        run: npm run dev &
        env:
          PORT: 5173

      - name: Wait for services
        run: |
          echo "Waiting for API and Web to be ready..."
          sleep 10

      - name: Run Playwright tests
        working-directory: .
        run: node runner/playwright/run-tests.js

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: runner/playwright/results/
          retention-days: 7
