name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:

# Avoid parallel runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      # Keep Playwright browsers inside node_modules cache (optional)
      PLAYWRIGHT_BROWSERS_PATH: 0
      # Base URL for tests (should match preview port below and playwright.config.ts)
      BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps (if any)
        run: npm ci
        # If monorepo uses workspaces/pnpm, adapt to:
        # uses: pnpm/action-setup@v4
        # with: { version: 9 }
        # run: pnpm -w install --frozen-lockfile

      # ---------------------------
      # OPTIONAL: Start backend first if UI depends on it
      # Uncomment and adjust port/command if your frontend makes API calls to runner/backend.
      # ---------------------------
      # - name: Start runner backend
      #   working-directory: runner
      #   run: |
      #     npm ci
      #     npm run start:backend > backend.log 2>&1 &
      #     npx wait-on tcp:127.0.0.1:3000
      #   env:
      #     NODE_ENV: test
      #     PORT: 3000

      - name: Install UI deps
        working-directory: runner/web
        run: npm ci

      - name: Build UI
        working-directory: runner/web
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ---------------------------
      # Run Playwright tests: Playwright will start Vite preview via webServer (no manual server in CI)
      # ---------------------------
      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}

      # Artifacts (HTML report)
      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      # Artifacts (traces/videos/screens)
      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pw-artifacts
          path: |
            test-results/**
            **/test-results/**
          if-no-files-found: ignore
