name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:5000
      CI: true
      PORT: 5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Diagnostic versions and folders
        run: |
          node -v
          npm -v
          ./node_modules/.bin/playwright --version || true
          ls -la
          ls -la playwright || true
          npm ls @playwright/test || true

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Install backend API deps
        working-directory: runner/api
        run: npm ci

      - name: Start backend API and wait
        timeout-minutes: 5
        run: |
          (cd runner/api && npm run dev > ../api-server.log 2>&1) &
          npx --yes wait-on "http-get://127.0.0.1:${PORT}/health" || npx --yes wait-on "http://127.0.0.1:${PORT}"
          curl -sS "http://127.0.0.1:${PORT}/health" || true

      - name: List discovered tests
        run: ./node_modules/.bin/playwright test --config=playwright/playwright.config.ts --list

      - name: Run Playwright tests (Chromium)
        run: |
          ./node_modules/.bin/playwright test \
            --config=playwright/playwright.config.ts \
            --project=chromium \
            --reporter=html,line

      - name: Locate HTML report directory
        if: always()
        run: |
          REPORT_DIR="playwright-report"
          if [ ! -d "$REPORT_DIR" ] && [ -d "playwright/playwright-report" ]; then
            REPORT_DIR="playwright/playwright-report"
          fi
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          echo "Resolved REPORT_DIR=$REPORT_DIR"
          ls -la "$REPORT_DIR" || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: api-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        run: pkill -f "runner/api" || true
