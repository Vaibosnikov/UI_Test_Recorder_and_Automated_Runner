name: CI pipeline

on:
  push:
    branches:
     - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      # If your frontend needs a backend API, set it here:
      # VITE_API_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies for the whole repo if monorepo; otherwise scope to runner/web
      - name: Install deps (frontend)
        working-directory: runner/web
        run: npm ci

      # (Optional) start backend if required by UI; uncomment and adapt
      # - name: Start backend
      #   run: |
      #     npm run start:backend &
      #     npx wait-on tcp:127.0.0.1:3000

      - name: Build frontend
        working-directory: runner/web
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Do NOT start the UI manually here.
      # Playwright will start `npm run preview` via webServer config.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:4173

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload Playwright artifacts (traces/videos/screens)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pw-artifacts
          path: |
            test-results/**
            **/test-results/**
          if-no-files-found: ignore
