<!-- runner/recorder/src/ui/popup.html
     Popup UI for TestCraft Recorder.
     Buttons: Start, Stop, Export
 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TestCraft Recorder</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h3>TestCraft Recorder</h3>
      <div class="controls">
        <button id="start" class="btn">Start Recording</button>
        <button id="stop" class="btn">Stop Recording</button>
        <button id="export" class="btn primary">Export JSON</button>
      </div>
      <div id="status" class="status">Idle</div>
      <small class="note">Exported JSON matches Script Generator input schema.</small>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
