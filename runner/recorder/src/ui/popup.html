<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TestCraft Recorder</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg: #0f172a;
      --surface: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      width: 260px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: linear-gradient(160deg, var(--bg), var(--surface));
      color: var(--text);
    }

    .header {
      margin-bottom: 14px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      all: unset;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: background 0.2s ease, transform 0.05s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-export {
      border: 1px dashed rgba(255, 255, 255, 0.25);
      color: var(--muted);
    }

    .btn-export:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .status {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--success);
      min-height: 16px;
    }

    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">TestCraft Recorder</div>
    <div class="subtitle">Record UI flows effortlessly</div>
  </div>

  <div class="actions">
    <button id="start" class="btn-primary">Start Recording</button>
    <button id="stop" class="btn-secondary">Stop Recording</button>
    <button id="export" class="btn-export">Export Test JSON</button>
  </div>

  <div id="status" class="status"></div>

  <div class="footer">
    Built for Design & Computing
  </div>

  <script src="popup.js"></script>
</body>
</html>
