<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TestCraft Recorder</title>

  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;

      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #020617;
      --muted: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      width: 270px;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .theme-btn {
      all: unset;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
    }

    .theme-btn:hover {
      background: rgba(255,255,255,0.14);
    }

    svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.2s infinite;
      display: none;
    }

    .dot.active {
      display: inline-block;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .counter {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      all: unset;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-start {
      border: 1px solid var(--green);
      color: var(--green);
    }

    .btn-start:hover {
      background: rgba(34,197,94,0.15);
    }

    .btn-stop {
      border: 1px solid var(--red);
      color: var(--red);
    }

    .btn-stop:hover {
      background: rgba(239,68,68,0.15);
    }

    .btn-export {
      border: 1px solid var(--blue);
      color: var(--blue);
    }

    .btn-export:hover {
      background: rgba(59,130,246,0.15);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }

    .error {
      color: var(--red);
      display: none;
      font-size: 12px;
      margin-top: 6px;
    }

    .error.show {
      display: block;
    }

    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="title">🧪 TestCraft</div>
    <button id="themeToggle" class="theme-btn"></button>
  </div>

  <div class="indicator">
    <span id="recordDot" class="dot"></span>
    <span id="recordText">Idle</span>
  </div>

  <div id="counter" class="counter">Steps: 0</div>

  <div class="actions">
    <button id="start" class="btn btn-start">
      <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
      Start Recording
    </button>

    <button id="stop" class="btn btn-stop">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
      Stop Recording
    </button>

    <button id="export" class="btn btn-export">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v12"/>
        <path d="M8 11l4 4 4-4"/>
        <path d="M5 21h14"/>
      </svg>
      Export JSON
    </button>
  </div>

  <div id="error" class="error">⚠ Unsupported page for recording</div>
  <div id="status" class="status"></div>

  <div class="footer">Recorder • Script Gen • Playwright</div>

  <script src="popup.js"></script>
</body>
</html>
